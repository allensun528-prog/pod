<style>
:root{--bg:#101522;--panel:#1b2335;--line:#303c54;--text:#eef3ff;--muted:#9caac4;--accent:#78d8bd}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#202c43,#101522 55%);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:22px;min-height:100vh;min-height:100dvh;padding: max(10px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));overscroll-behavior:none}
button,input{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:10px 16px;background:var(--accent);color:#10221e;font-weight:800}button.secondary{background:#34415a;color:#eef3ff}
.wrap{max-width:820px;margin:auto}.panel{background:rgba(27,35,53,.96);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 16px 40px #0003}
h1{font-size:clamp(22px,3vw,32px);margin:0 0 8px}.sub{color:var(--muted);margin:0 0 20px}.setup{max-width:520px;margin:8vh auto}.setup label{display:block;margin:16px 0 7px;color:#c8d4e9}.setup input{width:100%;padding:12px;border-radius:10px;border:1px solid #52617a;background:#111827;color:white;font-size:18px}.error{min-height:22px;color:#ff9d9d;font-size:14px;margin-top:6px}
.game{display:none}.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}.stats{display:flex;gap:10px;flex-wrap:wrap}.stat{background:#111827;border:1px solid var(--line);border-radius:10px;padding:8px 12px;color:var(--muted)}.stat strong{color:white;font-size:20px;margin-left:5px}
.layout{display:grid;grid-template-columns:250px minmax(0,420px);gap:16px;align-items:start;justify-content:center}.board-wrap{width:100%;max-width:420px;margin:0 auto}.board{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px;padding:8px;background:#0c111d;border:1px solid #34415a;border-radius:12px;touch-action:pan-y;user-select:none}
.tile{position:relative;aspect-ratio:1;border:2px solid #dfe7f5;border-radius:9px;overflow:hidden;background:#fff;display:flex;align-items:center;justify-content:center;min-width:0;cursor:grab;transition:transform .08s,border-color .08s}.tile:active{cursor:grabbing}.tile img{width:82%;height:82%;object-fit:cover;pointer-events:none;border-radius:5px;box-shadow:0 1px 4px #0005}.tile .fallback{width:82%;height:82%;display:flex;align-items:center;justify-content:center;border-radius:5px;background:#ffffffd9;font-weight:900;color:#243047;font-size:clamp(12px,2vw,23px)}.tile .level{position:absolute;top:1px;right:1px;min-width:16px;height:16px;padding:0 3px;border-radius:5px;background:#121827;color:white;font-size:10px;line-height:16px;text-align:center;font-weight:900;box-shadow:0 1px 3px #0008}.tile .tier{position:absolute;bottom:1px;left:1px;border-radius:4px;padding:1px 3px;background:#101827e8;color:#fff;font-size:9px;font-weight:800}.tile.selected{outline:3px solid #ffe08a;outline-offset:-3px;transform:scale(.95)}
.tile.swap-anim{animation:swapPulse .22s cubic-bezier(.2,.8,.2,1)}
.tile.match-anim{animation:matchBurst .22s ease-out both;z-index:2}
.tile.refill-anim{animation:refillSlide .28s cubic-bezier(.2,.75,.25,1) both}.flyer{position:fixed;z-index:9999;pointer-events:none;border:2px solid #fff;border-radius:9px;overflow:hidden;box-shadow:0 8px 26px #0009}.flyer img{width:100%;height:100%;object-fit:cover}
.tile.dragging{opacity:.38;transform:scale(1.06);filter:brightness(1.12)}
@keyframes swapPulse{0%{transform:scale(.88) rotate(-3deg);filter:brightness(1.35)}65%{transform:scale(1.08) rotate(2deg)}100%{transform:scale(1);filter:brightness(1)}}
@keyframes matchBurst{0%{transform:scale(1);opacity:1;filter:brightness(1)}45%{transform:scale(1.16);opacity:.9;filter:brightness(1.8)}100%{transform:scale(.55);opacity:0;filter:brightness(2)}}
@keyframes refillSlide{0%{transform:translateX(24px) scale(.88);opacity:.25}65%{transform:translateX(-3px) scale(1.04);opacity:1}100%{transform:translateX(0) scale(1);opacity:1}}.tier-1{background:#fff}.tier-2{background:#39b66b}.tier-3{background:#3288e8}.tier-4{background:#a65ce5}.tier-5{background:#f39b31}
.side h2{font-size:18px;margin:0 0 10px}.party{display:grid;gap:12px}.party-group{border:1px solid var(--line);border-radius:11px;padding:9px;background:#121a29}.party-head{display:flex;align-items:center;justify-content:space-between;font-weight:800;margin-bottom:7px}.party-head small{font-weight:500;color:var(--muted)}.party-list{display:flex;gap:5px;flex-wrap:wrap;min-height:48px}.party-unit{position:relative;width:38px;height:38px;border:2px solid #dfe7f5;border-radius:7px;overflow:visible;background:#fff}.party-unit img{width:100%;height:100%;object-fit:cover;border-radius:5px}.party-unit .unit-meta{position:absolute;top:-9px;right:-7px;background:#111827;color:white;border:1px solid #fff;border-radius:6px;padding:1px 3px;font-size:10px;white-space:nowrap}.empty{font-size:12px;color:#71809b;align-self:center}.log{margin-top:14px;color:#b8c5dc;font-size:13px;min-height:40px;line-height:1.5}.legend{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;color:var(--muted);font-size:12px}.legend span{display:flex;align-items:center;gap:4px}.swatch{width:12px;height:12px;border-radius:3px;border:1px solid #ffffff80;display:inline-block}.hint{font-size:12px;line-height:1.6;color:var(--muted);margin-top:12px}.disabled{opacity:.5;pointer-events:none}
@media(max-width:760px){body{padding: max(6px,env(safe-area-inset-top)) max(6px,env(safe-area-inset-right)) max(6px,env(safe-area-inset-bottom)) max(6px,env(safe-area-inset-left))}.wrap{max-width:none}.layout{grid-template-columns:minmax(0,.78fr) minmax(0,1.22fr);gap:7px;align-items:start}.board-wrap{max-width:100%;width:100%}.board{gap:3px;padding:4px}.tile{border-radius:5px;border-width:1px}.tile .level{font-size:9px;min-width:13px;height:14px;line-height:14px}.tile .tier{font-size:8px}.side .party{grid-template-columns:1fr}.party-unit{width:clamp(22px,5.8vw,30px);height:clamp(22px,5.8vw,30px)}.panel{padding:7px;border-radius:10px}.party-group{padding:5px}.party-head{font-size:12px}.hint{font-size:10px;line-height:1.35;margin-top:7px}.topbar{gap:6px;margin-bottom:7px}.topbar h1{font-size:clamp(16px,3.3vw,22px)}.topbar .sub{font-size:10px;line-height:1.3}.stats{gap:4px}.stat{font-size:10px;padding:4px 6px}.stat strong{font-size:14px;margin-left:3px}.topbar button{font-size:11px;padding:6px 8px}.legend{gap:4px;margin-top:6px;font-size:9px}.swatch{width:9px;height:9px}.log{font-size:10px;min-height:24px;margin-top:6px;line-height:1.3}}
@media (orientation:landscape) and (max-height:600px){body{padding: max(4px,env(safe-area-inset-top)) max(5px,env(safe-area-inset-right)) max(4px,env(safe-area-inset-bottom)) max(5px,env(safe-area-inset-left))}.game{min-height:calc(100dvh - 8px)}.topbar{margin-bottom:5px;flex-wrap:nowrap;min-height:34px}.topbar>div:first-child{min-width:0}.topbar h1{font-size:clamp(15px,2.8vh,20px);white-space:nowrap}.topbar .sub{font-size:9px;white-space:nowrap}.stats{flex-wrap:nowrap}.stat{white-space:nowrap;padding:3px 5px;font-size:9px}.stat strong{font-size:13px}.topbar button{white-space:nowrap;padding:5px 7px;font-size:10px}.layout{grid-template-columns:minmax(0,.82fr) minmax(0,1.18fr);gap:6px;align-items:start}.side{padding:6px}.side h2{font-size:13px;margin-bottom:5px}.side .party{grid-template-columns:repeat(2,minmax(0,1fr));gap:5px}.party-group{padding:4px;min-width:0}.party-head{font-size:10px;margin-bottom:4px}.party-head small{font-size:9px}.party-list{gap:3px;min-height:26px}.party-unit{width:clamp(19px,4.7vh,27px);height:clamp(19px,4.7vh,27px)}.empty{font-size:9px}.side .hint{font-size:9px;line-height:1.25}.board-wrap{width:min(100%,calc(100dvh - 66px));max-width:calc(100dvh - 66px);margin:0 auto}.board-wrap>.panel{padding:4px}.board{gap:2px;padding:3px;border-radius:7px}.tile{border-radius:4px}.tile img{width:78%;height:78%;border-radius:3px}.tile .level{top:0;right:0;min-width:11px;height:12px;line-height:12px;padding:0 2px;font-size:8px;border-radius:3px}.tile .tier{bottom:0;left:0;padding:0 2px;font-size:7px;border-radius:2px}.legend{font-size:8px;gap:4px;margin-top:4px}.log{font-size:9px;min-height:20px;margin-top:4px}.swatch{width:8px;height:8px}}
@media (orientation:portrait) and (max-width:760px){.layout{grid-template-columns:1fr}.side{order:2}.board-wrap{order:1;max-width:min(100%,520px)}.side .party{grid-template-columns:repeat(2,minmax(0,1fr))}.topbar{align-items:flex-start}.topbar>div:first-child .sub{white-space:normal}}

</style>
</head>
<body>
<div class="wrap">
  <section class="panel setup" id="setup">
    <h1>角色三消合成</h1>
    <p class="sub">6 × 6 棋盘 · 四种角色 · 消除、升阶并自动上阵</p>
    <label for="stepsInput">本局步数（1–49）</label>
    <input id="stepsInput" type="number" min="1" max="49" step="1" value="20" inputmode="numeric">
    <div class="error" id="setupError"></div>
    <button id="startBtn" style="width:100%;margin-top:8px">进入游戏</button>
    <p class="hint">头像素材请与本 HTML 放在同一文件夹：icon_a.png、icon_b.png、icon_c.png、icon_d.png，以及 chara_a.png、chara_b.png、chara_c.png、chara_d.png。</p>
  </section>

  <section class="game" id="game">
    <div class="topbar">
      <div><h1>角色三消合成</h1><p class="sub" style="margin:4px 0 0">拖动一个头像到另一个位置交换；每次交换消耗 1 步。</p></div>
      <div class="stats"><div class="stat">剩余步数<strong id="stepsLeft">20</strong></div><div class="stat">上阵人数<strong id="partyCount">0</strong></div></div>
      <button class="secondary" id="restartBtn">重新开始</button>
    </div>
    <div class="layout">
      <aside class="panel side">
        <h2>上阵角色</h2>
        <div class="party" id="party"></div>
        <p class="hint">每条被消除的横线或竖线各上阵 1 名角色：优先选择该线中阶级最高者；阶级相同时选择等级最高者。头像右上角显示等级，左下角显示阶级。</p>
      </aside>
      <div class="board-wrap">
        <div class="panel" style="padding:8px"><div id="board" class="board" aria-label="6乘6三消棋盘"></div></div>
        <div class="legend">
          <span><i class="swatch tier-1"></i>1阶</span><span><i class="swatch tier-2"></i>2阶</span><span><i class="swatch tier-3"></i>3阶</span><span><i class="swatch tier-4"></i>4阶</span><span><i class="swatch tier-5"></i>5阶</span>
        </div>
        <div class="log" id="log">开始交换头像吧。</div>
      </div>
    </div>
  </section>
</div>
<script>
(() => {
  const SIZE=6, N=4, names=['A','B','C','D'];
  const iconFiles=['icon_a.png','icon_b.png','icon_c.png','icon_d.png'];
  const charaFiles=['chara_a.png','chara_b.png','chara_c.png','chara_d.png'];
  const tierColors=['#e7edf6','#39b66b','#3288e8','#a65ce5','#f39b31'];
  const $=id=>document.getElementById(id);
  let board=[],steps=20,party=[[],[],[],[]],busy=false,selected=null,dragFrom=null,swapAnim=new Set(),matchAnim=new Set(),refillAnim=new Set(),touchDrag=null,suppressClick=false;
  const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
  const rand=n=>Math.floor(Math.random()*n);
  const makeTile=(chara=rand(N),tier=1,level=0)=>({chara,tier,level});
  const idx=(r,c)=>r*SIZE+c;
  const pos=i=>({r:Math.floor(i/SIZE),c:i%SIZE});
  const isValid=(r,c)=>r>=0&&r<SIZE&&c>=0&&c<SIZE;
  const copyTile=t=>({...t});
  function image(src,alt){const im=document.createElement('img');im.src=src;im.alt=alt;im.onerror=()=>im.remove();return im}
  function initialBoard(){
    // Rejection sampling prevents starting horizontal/vertical triples.
    board=[];
    for(let i=0;i<SIZE*SIZE;i++){
      let t,tries=0;
      do{
        t=makeTile( rand(N),1,0);tries++;
      }while(tries<100 && createsTriple(i,t));
      board.push(t);
    }
  }
  function createsTriple(i,t){
    const {r,c}=pos(i);
    return (c>=2&&board[idx(r,c-1)]?.chara===t.chara&&board[idx(r,c-2)]?.chara===t.chara)
      ||(r>=2&&board[idx(r-1,c)]?.chara===t.chara&&board[idx(r-2,c)]?.chara===t.chara);
  }
  function render(){
    const root=$('board');root.innerHTML='';
    board.forEach((t,i)=>{
      const cell=document.createElement('div');
      cell.className=`tile tier-${t.tier}`+(selected===i?' selected':'')+(swapAnim.has(i)?' swap-anim':'')+(matchAnim.has(i)?' match-anim':'')+(refillAnim.has(i)?' refill-anim':'');
      cell.dataset.index=i;
      cell.style.background=tierColors[t.tier-1];
      cell.style.borderColor=['#c5d0e0','#39b66b','#3288e8','#a65ce5','#f39b31'][t.tier-1];
      cell.style.boxShadow=`inset 0 0 0 3px ${['#c5d0e0','#39b66b','#3288e8','#a65ce5','#f39b31'][t.tier-1]},0 1px 3px #0005`;
      const im=image(iconFiles[t.chara],names[t.chara]);cell.appendChild(im);
      if(!im.parentNode){} // failed image falls back to letter below via onerror listener
      im.onerror=()=>{im.remove();const f=document.createElement('span');f.className='fallback';f.textContent=names[t.chara];cell.appendChild(f)};
      const lv=document.createElement('span');lv.className='level';lv.textContent=t.level;cell.appendChild(lv)
      const tier=document.createElement('span');tier.className='tier';tier.textContent=`${t.tier}阶`;cell.appendChild(tier);
      cell.draggable=true;
      cell.addEventListener('dragstart',e=>{if(busy||steps<=0){e.preventDefault();return}dragFrom=i;cell.classList.add('dragging');e.dataTransfer.setData('text/plain',String(i));e.dataTransfer.effectAllowed='move'});
      cell.addEventListener('dragend',()=>{cell.classList.remove('dragging');dragFrom=null});
      cell.addEventListener('dragover',e=>{e.preventDefault()});
      cell.addEventListener('drop',e=>{e.preventDefault();const from=dragFrom??Number(e.dataTransfer.getData('text/plain'));dragFrom=null;swapAction(from,i)});
      // iOS Safari does not consistently support native HTML drag-and-drop on touch screens.
      cell.addEventListener('pointerdown',e=>{
        if(e.pointerType!=='touch'||busy||steps<=0)return;
        const rect=cell.getBoundingClientRect();
        touchDrag={from:i,startX:e.clientX,startY:e.clientY,moved:false,ghost:null,offsetX:e.clientX-rect.left,offsetY:e.clientY-rect.top};
        cell.setPointerCapture?.(e.pointerId);
      });
      cell.addEventListener('pointermove',e=>{
        if(!touchDrag||touchDrag.from!==i)return;
        if(!touchDrag.moved&&Math.hypot(e.clientX-touchDrag.startX,e.clientY-touchDrag.startY)<7)return;
        if(!touchDrag.moved){touchDrag.moved=true;const rect=cell.getBoundingClientRect();const ghost=cell.cloneNode(true);ghost.classList.remove('selected','swap-anim','match-anim','refill-anim');ghost.classList.add('flyer');ghost.style.position='fixed';ghost.style.left=rect.left+'px';ghost.style.top=rect.top+'px';ghost.style.width=rect.width+'px';ghost.style.height=rect.height+'px';ghost.style.opacity='.72';ghost.style.transform='scale(1.08)';document.body.appendChild(ghost);touchDrag.ghost=ghost;cell.style.opacity='.28'}
        if(touchDrag.ghost){touchDrag.ghost.style.left=(e.clientX-touchDrag.offsetX)+'px';touchDrag.ghost.style.top=(e.clientY-touchDrag.offsetY)+'px'}
        e.preventDefault();
      });
      cell.addEventListener('pointerup',e=>{
        if(!touchDrag||touchDrag.from!==i)return;
        const drag=touchDrag;touchDrag=null;
        if(drag.ghost)drag.ghost.remove();cell.style.opacity='';
        if(drag.moved){suppressClick=true;const target=document.elementFromPoint(e.clientX,e.clientY)?.closest('.tile');if(target){const to=Number(target.dataset.index);if(Number.isInteger(to)&&to!==drag.from)swapAction(drag.from,to)}setTimeout(()=>{suppressClick=false},80)}
      });
      cell.addEventListener('pointercancel',()=>{if(touchDrag&&touchDrag.from===i){touchDrag.ghost?.remove();touchDrag=null;cell.style.opacity=''}});
      // Click/tap two cells remains available as an alternative to dragging.
      cell.addEventListener('click',()=>{if(suppressClick||busy||steps<=0)return;if(selected===null){selected=i;render()}else if(selected===i){selected=null;render()}else{const from=selected;selected=null;swapAction(from,i)}});
      root.appendChild(cell);
    });
    $('stepsLeft').textContent=steps;
    $('partyCount').textContent=party.reduce((s,a)=>s+a.length,0);
    renderParty();
    if(steps<=0){$('log').textContent='步数已用完。点击“重新开始”返回设置页面。';root.classList.add('disabled')}else root.classList.remove('disabled');
  }
  function renderParty(){
    const root=$('party');root.innerHTML='';
    party.forEach((arr,ch)=>{
      const group=document.createElement('div');group.className='party-group';
      group.dataset.party=ch;const head=document.createElement('div');head.className='party-head';head.innerHTML=`<span>${names[ch]} 角色</span><small>${arr.length} 名</small>`;group.appendChild(head);
      const list=document.createElement('div');list.className='party-list';
      if(!arr.length){const empty=document.createElement('span');empty.className='empty';empty.textContent='尚未上阵';list.appendChild(empty)}
      arr.forEach(t=>{
        const unit=document.createElement('div');unit.className='party-unit';unit.style.background=tierColors[t.tier-1];
        const im=image(charaFiles[ch],names[ch]);im.onerror=()=>{im.remove();const f=document.createElement('span');f.className='fallback';f.textContent=names[ch];unit.appendChild(f)};unit.appendChild(im);
        const meta=document.createElement('span');meta.className='unit-meta';meta.textContent=`${t.tier}阶${t.level>0?' · '+t.level:''}`;unit.appendChild(meta);list.appendChild(unit);
      });
      group.appendChild(list);root.appendChild(group);
    });
  }
  function findLines(){
    const h=[],v=[];
    for(let r=0;r<SIZE;r++){let c=0;while(c<SIZE){let e=c+1;while(e<SIZE&&board[idx(r,e)].chara===board[idx(r,c)].chara)e++;if(e-c>=3)h.push({type:'h',cells:Array.from({length:e-c},(_,k)=>idx(r,c+k))});c=e}}
    for(let c=0;c<SIZE;c++){let r=0;while(r<SIZE){let e=r+1;while(e<SIZE&&board[idx(e,c)].chara===board[idx(r,c)].chara)e++;if(e-r>=3)v.push({type:'v',cells:Array.from({length:e-r},(_,k)=>idx(r+k,c))});r=e}}
    return {h,v};
  }
  function lineBest(line){
    return line.cells.map(i=>board[i]).filter(Boolean).sort((a,b)=>b.tier-a.tier||b.level-a.level)[0];
  }
  function groupsFromLines(lines){
    // Merge crossing/overlapping runs into connected components.
    const all=[...lines.h.map(x=>({...x,kind:'h'})),...lines.v.map(x=>({...x,kind:'v'}))];
    const parent=all.map((_,i)=>i);
    const root=x=>parent[x]===x?x:(parent[x]=root(parent[x]));
    const join=(a,b)=>{a=root(a);b=root(b);if(a!==b)parent[b]=a};
    for(let i=0;i<all.length;i++)for(let j=i+1;j<all.length;j++){
      if(all[i].cells.some(x=>all[j].cells.includes(x)))join(i,j);
    }
    const map=new Map();
    all.forEach((line,i)=>{const k=root(i);if(!map.has(k))map.set(k,{h:[],v:[],cells:new Set(),lines:[]});const g=map.get(k);g[line.kind].push(line);line.cells.forEach(x=>g.cells.add(x));g.lines.push(line)});
    return [...map.values()];
  }
  function mergedTile(group){
    const tiles=[...group.cells].map(i=>board[i]).filter(Boolean);
    if(!tiles.length)return makeTile();
    // 新块等级 = 本次合成中所有被消除格子的等级之和 + 连线长度奖励。
    // 每条线以 3 连为基准，每多 1 格额外 +1；交叉/工字形分别累计各条线的奖励。
    const levelSum=tiles.reduce((sum,t)=>sum+t.level,0);
    const lineBonus=group.lines.reduce((sum,line)=>sum+Math.max(0,line.cells.length-3),0);
    const sum=Math.min(9,levelSum+lineBonus);
    const tiers=tiles.map(t=>t.tier),max=Math.max(...tiers),same=tiers.every(x=>x===tiers[0]);
    const cross=group.h.length>0&&group.v.length>0;
    let tier;
    if(same)tier=Math.min(5,tiers[0]+(cross?2:1));
    else tier=Math.min(5,max+(cross?1:0));
    return {chara:tiles[0].chara,tier,level:sum};
  }
  function collectPartyForLines(group){
    // Each distinct horizontal or vertical line adds one unit; use its highest-tier, then highest-level member.
    return group.lines.map(line=>{
      const best=line.cells.map(i=>({tile:board[i],index:i})).filter(x=>x.tile).sort((a,b)=>b.tile.tier-a.tile.tier||b.tile.level-a.tile.level)[0];
      return best?{tile:copyTile(best.tile),sourceIndex:best.index}:null;
    }).filter(Boolean);
  }
  async function flyToParty(entry){
    const source=$('board').querySelector(`[data-index="${entry.sourceIndex}"]`);
    const target=$('party').querySelector(`[data-party="${entry.tile.chara}"]`);
    if(!source||!target){party[entry.tile.chara].push(copyTile(entry.tile));renderParty();return}
    const a=source.getBoundingClientRect(),b=target.getBoundingClientRect();
    const flyer=document.createElement('div');flyer.className='flyer';flyer.style.left=`${a.left}px`;flyer.style.top=`${a.top}px`;flyer.style.width=`${a.width}px`;flyer.style.height=`${a.height}px`;flyer.style.background=tierColors[entry.tile.tier-1];
    const im=image(charaFiles[entry.tile.chara],names[entry.tile.chara]);flyer.appendChild(im);document.body.appendChild(flyer);
    const dx=(b.left+b.width/2)-(a.left+a.width/2),dy=(b.top+b.height/2)-(a.top+a.height/2);
    flyer.animate([{transform:'translate(0,0) scale(1)',opacity:1},{transform:`translate(${dx}px,${dy}px) scale(.35)`,opacity:.25}],{duration:430,easing:'cubic-bezier(.2,.75,.25,1)'});
    await wait(430);flyer.remove();party[entry.tile.chara].push(copyTile(entry.tile));renderParty();
  }
  async function resolveMatches(playerMove=false,targetIndex=0){
    let chain=0;
    while(chain<30){
      const lines=findLines();
      if(!lines.h.length&&!lines.v.length)break;
      chain++;
      const groups=groupsFromLines(lines);
      const removals=new Set();
      const partyEntries=groups.flatMap(g=>{g.cells.forEach(i=>removals.add(i));return collectPartyForLines(g)});
      // 首次玩家交换触发的合成：优先把包含交换落点（原 A 移动到的 B 格）的那一组放在落点，
      // 不要简单地把 groups[0] 放到落点，否则多组同时消除时可能放错合成块。
      const created=groups.map(g=>({
        group:g,
        tile:mergedTile(g),
        place:playerMove&&chain===1&&g.cells.has(targetIndex)?targetIndex:chooseAutoPosition(g)
      }));

      // 消除前短暂闪光、放大，然后缩小消失。
      matchAnim=new Set(removals);swapAnim.clear();refillAnim.clear();render();
      await wait(220);
      matchAnim.clear();
      for(const entry of partyEntries) await flyToParty(entry);

      // 每一行保留未消除的头像并向左压缩，右侧补入新头像。
      const changed=new Set();
      for(let r=0;r<SIZE;r++){
        const survivors=[];
        for(let c=0;c<SIZE;c++){
          const i=idx(r,c);
          if(!removals.has(i))survivors.push({tile:board[i],from:c});
          else changed.add(i);
        }
        while(survivors.length<SIZE)survivors.push({tile:makeTile(rand(N),1,0),from:-1});
        for(let c=0;c<SIZE;c++){
          board[idx(r,c)]=survivors[c].tile;
          if(survivors[c].from!==c)changed.add(idx(r,c));
        }
      }
      // 合成结果放在目标位置；多条独立消除线也各自生成结果。
      created.forEach(({tile,place})=>{
        const p=Math.max(0,Math.min(SIZE*SIZE-1,place));
        board[p]=tile;changed.add(p);
      });
      refillAnim=new Set(changed);render();
      $('log').textContent=`消除 ${removals.size} 个头像，生成 ${created.length} 个新头像；正在压缩棋盘并补充新头像……`;
      await wait(280);
      refillAnim.clear();render();
      $('log').textContent=`消除 ${removals.size} 个头像，合成 ${created.length} 个新头像；上阵 ${groups.reduce((s,g)=>s+g.lines.length,0)} 名角色。`;
      playerMove=false;
    }
    matchAnim.clear();refillAnim.clear();swapAnim.clear();render();
    return chain>0;
  }
  function chooseAutoPosition(g){
    if(g.h.length&&g.v.length){
      const intersections=[];
      g.h.forEach(h=>g.v.forEach(v=>h.cells.forEach(i=>{if(v.cells.includes(i))intersections.push(i)})));
      if(intersections.length)return intersections.sort((a,b)=>pos(a).c-pos(b).c||pos(a).r-pos(b).r)[0];
    }
    if(g.h.length){
      const cells=g.h.flatMap(l=>l.cells);return cells.sort((a,b)=>pos(a).c-pos(b).c||pos(a).r-pos(b).r)[0];
    }
    const cells=g.v.flatMap(l=>l.cells);return cells.sort((a,b)=>pos(a).r-pos(b).r||pos(a).c-pos(b).c)[0];
  }
  async function swapAction(a,b){
    if(busy||steps<=0||!Number.isInteger(a)||!Number.isInteger(b)||a===b)return;
    busy=true;selected=null;steps--;
    [board[a],board[b]]=[board[b],board[a]];
    swapAnim=new Set([a,b]);matchAnim.clear();refillAnim.clear();render();
    // 先给交换一个明确的短动画，再判断是否触发消除。
    await wait(230);swapAnim.clear();render();
    const lines=findLines();
    if(lines.h.length||lines.v.length){
      await resolveMatches(true,b);
      if(steps>0)$('log').textContent+=' 可以继续操作。';
    }else $('log').textContent='已交换头像。当前没有触发消除。';
    busy=false;render();
  }
  function start(){
    const raw=$('stepsInput').value;
    if(!/^\d+$/.test(raw)||Number(raw)<1||Number(raw)>=50){$('setupError').textContent='请输入 1 到 49 之间的整数。';return}
    steps=Number(raw);party=[[],[],[],[]];selected=null;busy=false;swapAnim.clear();matchAnim.clear();refillAnim.clear();
    // Avoid initial matches, and retry if an unlucky fallback sequence created one.
    let tries=0;do{initialBoard();tries++}while((findLines().h.length||findLines().v.length)&&tries<100);
    $('setup').style.display='none';$('game').style.display='block';$('log').textContent='游戏开始！拖动头像交换，或依次点击两个头像。';render();
  }
  $('startBtn').addEventListener('click',start);
  $('stepsInput').addEventListener('input',()=>{$('setupError').textContent=''});
  $('restartBtn').addEventListener('click',()=>{$('game').style.display='none';$('setup').style.display='block';$('setupError').textContent='';});
})();
</script>
